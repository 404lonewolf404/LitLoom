[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litloom"
dynamic = ["version"]
description = "LitLoom: a local-first, auditable research literature workspace for graduate students"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LitLoom contributors"}]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.34,<1",
    "alembic>=1.14,<2",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "langchain-core>=0.3.45,<0.4",
    "langgraph>=0.2.76,<0.3",
]

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
vision = ["PyMuPDF>=1.24"]
mcp = ["mcp>=2.3,<3"]
rag-eval = ["ragas>=0.4,<1"]

[project.scripts]
litloom = "app:main"
litloom-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["app", "mcp_server"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "literature_desk.__version__"}

[tool.setuptools.data-files]
static = ["static/index.html", "static/app.css", "static/pdf-import.css", "static/agent-autonomy.css", "static/study.css", "static/workspace.css", "static/reading-desk.css", "static/app.js", "static/favicon.svg", "static/litloom-wordmark.png", "static/litloom-icon.png"]
"static/js" = ["static/js/views.js", "static/js/discovery.js", "static/js/library.js", "static/js/reader.js", "static/js/actions.js"]
docs = ["README.md", "LICENSE", "ARCHITECTURE.md", "DEVELOPMENT.md", "openapi.yaml", ".env.example"]
evaluation = ["evaluation/retrieval_baseline.json"]

[tool.setuptools.packages.find]
include = ["literature_desk*"]

[tool.unittest]
test-directory = "tests"
