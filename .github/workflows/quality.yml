name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        shell: pwsh
        run: python -m pip install -e ".[pdf,vision,mcp]"
      - name: Check tracked environment files
        shell: pwsh
        run: .\scripts\verify.ps1 -Stage SecretFiles
      - name: Check runtime configuration
        shell: pwsh
        run: .\scripts\verify.ps1 -Stage RuntimeConfig
      - name: Check Python syntax
        shell: pwsh
        run: .\scripts\verify.ps1 -Stage PythonSyntax
      - name: Check JavaScript syntax
        shell: pwsh
        run: .\scripts\verify.ps1 -Stage JavaScriptSyntax
      - name: Check API contract files
        shell: pwsh
        run: .\scripts\verify.ps1 -Stage Contracts
      - name: Run unit and integration tests
        shell: pwsh
        run: .\scripts\verify.ps1 -Stage Tests
      - name: Build distributable wheel
        shell: pwsh
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: litloom-wheel
          path: dist/*.whl
